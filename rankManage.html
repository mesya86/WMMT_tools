<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>湾岸マキシ　便利ツール - ランク管理（6以降）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1><a href="index.html">湾岸マキシ　便利ツール</a></h1>
    <!-- ハンバーガーメニュー -->
    <nav class="navbar">
      <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </header>

  <!-- オーバーレイ -->
  <div id="overlay"></div>

  <!-- スライドメニュー -->
  <ul class="menu" id="menu"></ul>

  <main>
    <h1>ランク管理（6以降）</h2>
    <h2>記録を入力することで、ランクアップまでのカウントを提示します</h2>
    <!-- 入力フォーム -->
    <form id="rankForm" method="post">

      <!-- ストーリー -->
      <label for="story">クリア総数</label>
      <input type="number" id="story" name="story">
      <p>次のランクまで残り: <span id="remainingStoryCount">-</span>話</p>

      <!-- 分身 -->
      <label for="onlineGhost">分身撃破数</label>
      <input type="number" id="onlineGhost" name="onlineGhost">
      <p>次のランクまで残り: <span id="remainingOnlineGhostCount">-</span>撃破<br>
      <span class="note">※ トロフィー数はランクに影響しません</span></p>

      <!-- 乱入 -->
      <label for="VSPlayer">撃墜数</label>
      <input type="number" id="VSPlayer" name="VSPlayer">
      <p>次のランクまで残り: <span id="remainingVSPlayer">-</span>撃墜</p>

      <button type="submit">算出する</button>
      <button type="button" id="resetBtn" class="small">リセット</button>
    </form>
  </main>
  <footer>
    <!-- フッター情報 -->
  </footer>
</body>

</html>
<script src="js/rankManage.js"></script>
<script src="js/menus.js"></script>
